{% extends "base.html" %}

{% block title %}Payment Successful - AI Resume Screening Pro{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="glass-card glass-card-glow p-5 mx-auto" style="max-width: 520px;">
    <div class="rounded-circle bg-success bg-opacity-25 text-success d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-check-lg display-3"></i>
    </div>
    
    <h2 class="fw-bold mb-2">Payment Successful!</h2>
    <p class="text-muted mb-4">Your subscription has been activated successfully. All premium features are now unlocked for your account.</p>
    
    <div class="d-flex gap-3 justify-content-center">
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-gradient px-4 py-3 fw-bold">
        Go to Dashboard <i class="bi bi-arrow-right ms-1"></i>
      </a>
      <a href="{{ url_for('scanner.upload') }}" class="btn btn-outline-glass px-4 py-3">
        Scan Resume
      </a>
    </div>
  </div>
</div>
{% endblock %}
