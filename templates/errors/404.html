{% extends "base.html" %}

{% block title %}404 Page Not Found - AI Resume Screening Pro{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="glass-card glass-card-glow my-5 p-5 max-w-lg mx-auto" style="max-width: 550px;">
    <div class="display-1 fw-extrabold text-primary mb-3">404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-gradient px-4 py-2">
      <i class="bi bi-house-door me-2"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
