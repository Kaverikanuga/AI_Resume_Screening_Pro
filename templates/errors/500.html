{% extends "base.html" %}

{% block title %}500 Server Error - AI Resume Screening Pro{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="glass-card glass-card-glow my-5 p-5 mx-auto" style="max-width: 550px;">
    <div class="display-1 fw-extrabold text-danger mb-3">500</div>
    <h2 class="fw-bold mb-3">Internal Server Error</h2>
    <p class="text-muted mb-4">Something went wrong on our end. Please try again or return to the dashboard.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-gradient px-4 py-2">
      <i class="bi bi-arrow-counterclockwise me-2"></i> Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
